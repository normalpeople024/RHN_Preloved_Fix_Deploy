<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Detail Produk | RHN Preloved</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div id="nav-root"></div>
<main class="container page-body" id="root">
  <div style="text-align:center;padding:3rem"><div style="font-size:2rem">⏳</div><p class="muted">Memuat produk…</p></div>
</main>
<footer class="footer">© 2026 RHN Preloved</footer>

<script type="module">
import { requireAuth, renderNav, getUserProfile, getLocalCart, setLocalCart, updateCartBadge, formatRp, toast, waNumber, auth, db, doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from './app.js';

const user    = await requireAuth();
const profile = await getUserProfile(user.uid);
renderNav(profile);

const id   = new URLSearchParams(location.search).get('id');
const root = document.getElementById('root');

if (!id) { root.innerHTML = `<div class="card"><p class="muted">ID produk tidak valid. <a href="home.html" style="color:var(--accent)">Kembali</a></p></div>`; }
else { await loadProduct(); }

async function loadProduct() {
  const snap = await getDoc(doc(db,'products',id));
  if (!snap.exists()) {
    root.innerHTML = `<div class="card"><p class="muted">Produk tidak ditemukan. <a href="home.html" style="color:var(--accent)">Kembali</a></p></div>`;
    return;
  }
  const p = { id: snap.id, ...snap.data() };
  document.title = `${p.name} | RHN Preloved`;

  // Reviews
  const rSnap = await getDocs(query(collection(db,'reviews'), where('productId','==',id)));
  const reviews = rSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  const avg = reviews.length ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1) : null;

  const imgs = p.images?.length ? p.images : ['https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=900&q=80'];
  const inCart = getLocalCart().some(c => c.id === id);

  root.innerHTML = `
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <a href="home.html" class="btn-ghost btn-sm">← Kembali</a>
      <span class="faint">/</span><span class="faint">${p.category}</span>
      <span class="faint">/</span><span class="faint" style="max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>
    </div>

    <div class="detail-layout">
      <div>
        <div class="gallery-main"><img id="main-img" src="${imgs[0]}" alt="${p.name}"/></div>
        ${imgs.length>1?`<div class="gallery-thumbs">${imgs.map((img,i)=>`<img src="${img}" class="${i===0?'active':''}" onclick="switchImg('${img}',this)"/>`).join('')}</div>`:''}
      </div>

      <div class="detail-info">
        <div>
          <p class="eyebrow">${p.category}</p>
          <h1 style="font-size:clamp(1.3rem,2.5vw,1.75rem);margin-block:.4rem .6rem">${p.name}</h1>
          <div class="detail-price">${formatRp(p.price)}</div>
        </div>

        <div class="detail-tags">
          <span class="badge badge-cond">${p.condition}</span>
          ${p.negotiable?`<span class="badge badge-neg">💬 Bisa Nego</span>`:`<span class="badge" style="background:var(--bg-input);color:var(--ink-faint);border:1px solid var(--border)">Harga Tetap</span>`}
          ${avg?`<span class="badge" style="background:var(--yellow-lo);color:var(--yellow);border:1px solid rgba(234,179,8,.2)">⭐ ${avg} (${reviews.length})</span>`:''}
        </div>

        <p style="color:var(--ink-mid);line-height:1.75;font-size:.9rem">${p.description}</p>

        ${p.advantages||p.disadvantages?`
          <div class="detail-section">
            <h4>Kelebihan & Kekurangan</h4>
            <div class="pros-cons">
              <div class="pros-box"><strong>✅ Kelebihan</strong>${p.advantages||'-'}</div>
              <div class="cons-box"><strong>⚠ Kekurangan</strong>${p.disadvantages||'-'}</div>
            </div>
          </div>`:''}

        ${p.location?`<div class="detail-section"><h4>Lokasi COD</h4><p style="font-size:.88rem;color:var(--ink-mid)">📍 ${p.location}</p></div>`:''}

        <div class="detail-section">
          <h4>Informasi Penjual</h4>
          <div class="seller-card">
            <div class="seller-row">
              <div class="seller-avatar">${(p.sellerName||'?').charAt(0).toUpperCase()}</div>
              <div>
                <div class="seller-name">${p.sellerName}</div>
                <div class="seller-sub">@${p.sellerUsername||''} · Terverifikasi KTM</div>
              </div>
            </div>
            <div class="seller-contacts">
              <div class="contact-row">📱 ${p.phone}</div>
              <div class="contact-row">💬 WA: ${p.whatsapp}</div>
            </div>
          </div>
        </div>

        ${!p.sold?`
          <div style="display:flex;gap:.65rem;flex-wrap:wrap">
            <button class="btn-primary" style="flex:1" id="add-cart-btn" onclick="handleCart()">
              ${inCart?'🛒 Sudah di Keranjang':'🛒 Tambah ke Keranjang'}
            </button>
            <a class="btn-ghost" href="cart.html">Lihat Keranjang</a>
          </div>
          <a href="https://wa.me/${waNumber(p.whatsapp)}?text=${encodeURIComponent('Halo, saya tertarik dengan produk: '+p.name+' ('+formatRp(p.price)+'). Apakah masih tersedia?')}"
            target="_blank" class="btn-outline btn-full" style="text-align:center">
            💬 Hubungi Penjual via WhatsApp
          </a>
        `:`<div class="card" style="text-align:center;padding:1.5rem"><span style="color:var(--red);font-weight:700">Produk ini sudah terjual</span></div>`}
      </div>
    </div>

    <div style="margin-top:2rem">
      <div class="card">
        <h2 style="font-size:1.05rem;margin-bottom:1.1rem">Ulasan Pembeli ${reviews.length?`<span style="color:var(--ink-faint);font-size:.8rem;font-weight:400">(${reviews.length})</span>`:''}</h2>
        ${reviews.length ? reviews.map(r=>`
          <div class="review-card">
            <div class="review-header">
              <div><span style="font-weight:600;font-size:.85rem">${r.buyerName}</span>
              <div class="review-stars">${'⭐'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div></div>
              <span class="review-author">${r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString('id-ID') : ''}</span>
            </div>
            <p class="review-text">${r.text}</p>
          </div>`).join('')
          : `<p class="faint" style="text-align:center;padding:1rem">Belum ada ulasan.</p>`}
      </div>
    </div>`;

  window.switchImg = (src, el) => {
    document.getElementById('main-img').src = src;
    document.querySelectorAll('.gallery-thumbs img').forEach(i=>i.classList.remove('active'));
    el.classList.add('active');
  };

  window.handleCart = function() {
    const cart = getLocalCart();
    if (cart.some(c=>c.id===id)) { toast('Sudah di keranjang.','info'); return; }
    cart.push({ ...p, quantity: 1 });
    setLocalCart(cart);
    updateCartBadge();
    toast(`✓ ${p.name} ditambahkan ke keranjang.`, 'success');
    const btn = document.getElementById('add-cart-btn');
    if (btn) btn.textContent = '🛒 Sudah di Keranjang';
  };
}
</script>
</body>
</html>
